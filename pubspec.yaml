name: gapshap
description: GAPSHAP - A premium social messaging application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Supabase
  supabase_flutter: ^2.8.4
  supabase: ^2.7.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Push Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # Media & Files
  image_picker: ^1.1.2
  video_player: ^2.9.3
  file_picker: ^8.1.7
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  video_compress: ^3.1.3
  image: ^4.5.2

  # Voice Recording
  record: ^5.2.0
  audioplayers: ^6.1.0

  # UI & Animations
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  emoji_picker_flutter: ^4.2.0
  flutter_staggered_animations: ^1.1.1
  readmore: ^3.0.0
  timeago: ^3.7.0
  intl: ^0.20.2
  google_fonts: ^6.2.1

  # Utils
  uuid: ^4.5.1
  dio: ^5.7.0
  connectivity_plus: ^6.1.3
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  flutter_cache_manager: ^3.4.1
  mime: ^1.0.5
  path: ^1.9.1
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  collection: ^1.19.1

  # App Updates
  package_info_plus: ^8.1.3
  open_file: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.4
  freezed: ^2.5.8
  mockito: ^5.4.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
